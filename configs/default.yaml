data:
  cache_dir: "data/cache"
  cache_ttl_hours: 87600

backtest:
  initial_cash: 100000
  commission: 0.001
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  rebalance_frequency: "monthly"
  long_threshold: 0.6
  short_threshold: 0.4
  # Position sizing
  signal_weighted: true
  max_position_weight: 0.25
  max_positions: 15
  min_positions: 3
  cash_reserve_pct: 0.05
  # Fixed holding period (trading days)
  holding_period_days: 252
  # Risk management
  trailing_stop_pct: 0.20
  # Scale-in
  scale_in: true
  scale_in_pct: 0.50
  scale_in_days: 5

llm:
  primary_provider: "gemini"
  gemini_model: "gemini-3.0-flash-preview"
  anthropic_model: "claude-sonnet-4.6"
  temperature: 0.1

factors:
  factors:
    - graham_pe
    - price_to_book
    - graham_number
    - current_ratio
    - dividend_yield
  weights: {}
  sigmoid_weight: 0.4
