data:
  cache_dir: "data/cache"
  cache_ttl_hours: 24

backtest:
  initial_cash: 100000
  commission: 0.001
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  rebalance_frequency: "monthly"
  long_threshold: 0.6
  short_threshold: 0.4

llm:
  primary_provider: "gemini"
  gemini_model: "gemini-3.0-flash-preview"
  anthropic_model: "claude-sonnet-4.6"
  temperature: 0.1

factors:
  factors:
    - graham_pe
    - price_to_book
    - graham_number
    - current_ratio
    - dividend_yield
  weights: {}
